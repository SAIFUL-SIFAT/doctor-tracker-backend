services:
  mongo:
    image: mongo:7.0
    container_name: doctor-tracker-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    entrypoint:
      - bash
      - -c
      - |
        openssl rand -base64 756 > /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        chown 999:999 /tmp/mongo-keyfile
        mongod --replSet rs0 --bind_ip_all &
        MONGOPID=$$!
        until mongosh --eval "db.adminCommand('ping')" >/dev/null 2>&1; do
          sleep 1
        done
        mongosh --eval "try { rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]}) } catch (e) { print(e) }"
        wait $$MONGOPID
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
